name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E50914&color_dots=#EBEDF0,#FFC9CC,#FF8A91,#F0404C,#B0000F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E50914&color_dots=#161B22,#3B0A0D,#6E0F15,#A3121D,#E50914

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
